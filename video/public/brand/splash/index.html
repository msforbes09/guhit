<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Guhit splash prototype</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#FFF8EE;color:#1E1B2E;font-family:ui-rounded,"SF Pro Rounded","Nunito","Avenir Next",system-ui,sans-serif}
.phone{position:relative;width:min(100%,420px);height:100svh;margin:0 auto;overflow:hidden}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 24px 56px}
#home{display:flex;opacity:0;pointer-events:none}
#home h2{font-size:34px;margin:0 0 6px}
#home p{margin:0;opacity:.6;font-size:15px}
.mark{width:min(46vw,170px);aspect-ratio:1;opacity:0}
.mark svg,.word svg{display:block;width:100%;height:100%;overflow:visible}
.word{position:relative;width:100%;aspect-ratio:580/300;margin-top:-6px}
.word>div{position:absolute;inset:0;will-change:transform,opacity,filter}
.tag{margin:14px 0 0;font-size:clamp(17px,5vw,20px);font-weight:600;letter-spacing:.01em;opacity:0;text-align:center}
.foot{position:absolute;left:0;right:0;bottom:22px;text-align:center;font-size:12px;opacity:0;color:#1E1B2E99}
.tools{position:fixed;top:10px;right:10px;display:flex;gap:10px;align-items:center;z-index:5;font:13px/1 system-ui,sans-serif;background:#fff;border:1px solid #1E1B2E22;border-radius:999px;padding:6px 8px 6px 12px}
.tools button{font:inherit;font-weight:600;border:0;border-radius:999px;background:#F26B3A;color:#fff;padding:8px 14px;cursor:pointer}
.tools button:focus-visible,.tools input:focus-visible{outline:3px solid #2F9BEA;outline-offset:2px}
.tools label{display:flex;gap:6px;align-items:center;cursor:pointer}
</style>
</head>
<body>
<div class="tools"><label><input type="checkbox" id="rm"> Reduced motion</label><button id="replay" type="button">Replay</button></div>
<main class="phone">
  <section class="screen" id="home" aria-label="Home placeholder"><h2>Home</h2><p>Placeholder screen</p></section>
  <section class="screen" id="splash" aria-label="Guhit">
    <div class="mark" id="mark" aria-hidden="true">
<!-- MARK: contents of mark.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" preserveAspectRatio="xMidYMid meet" focusable="false">
<title>Guhit mark</title>
<defs><filter id="crayon" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3.5" xChannelSelector="R" yChannelSelector="G"/></filter></defs>
<!-- Remove filter="url(#crayon)" from #art to turn the crayon texture off. Loop is one stroked path (pathLength=100) for stroke-dasharray draw-on. -->
<g id="art" filter="url(#crayon)">
  <circle id="face" cx="277" cy="247" r="100" fill="#FFF8EE"/>
  <g id="rays" fill="none" stroke-width="25" stroke-linecap="round">
    <line id="ray-1" x1="167" y1="105" x2="203" y2="138" stroke="#FFC21A"/>
    <line id="ray-2" x1="254" y1="70" x2="254" y2="117" stroke="#FFC21A"/>
    <line id="ray-3" x1="352" y1="102" x2="322" y2="130" stroke="#FFC21A"/>
    <line id="ray-4" x1="442" y1="200" x2="407" y2="227" stroke="#2F9BEA"/>
    <line id="ray-5" x1="412" y1="262" x2="450" y2="272" stroke="#2F9BEA"/>
    <line id="ray-6" x1="130" y1="247" x2="80" y2="260" stroke="#2F9BEA"/>
    <line id="ray-7" x1="90" y1="189" x2="135" y2="213" stroke="#2F9BEA"/>
  </g>
  <path id="loop" pathLength="100" d="M358,388 C346,406 322,400 314,374 C310,358 308,348 305,340 A97,97 0 1 0 249,154 A97,97 0 1 0 305,340 C282,364 232,398 168,408 C122,415 85,395 85,360 C85,330 110,313 135,313 C165,313 183,335 175,360 C170,378 152,390 128,392" fill="none" stroke="#F26B3A" stroke-width="27" stroke-linecap="round" stroke-linejoin="round"/>
  <circle id="eye-l" cx="243" cy="243" r="12.5" fill="#1E1B2E"/>
  <circle id="eye-r" cx="325" cy="238" r="12.5" fill="#1E1B2E"/>
  <path id="smile" d="M272,261 Q287,284 304,260" fill="none" stroke="#1E1B2E" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
</g>
</svg>

    </div>
    <div class="word" role="img" aria-label="guhit">
      <!-- CURSIVE SLOT: replace this one svg with wordmark-cursive-v2.svg (needs #stroke, #crayon-i, #i-dot; optional #t-bar) -->
      <div id="cursive">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="80 20 580 300" preserveAspectRatio="xMidYMid meet" focusable="false">
<title>guhit</title>
<!-- #stroke: one path (pathLength=100) in writing order g-u-h, runs behind the crayon, then t stem. crayon-i and i-dot after; t-bar last. -->
<path id="stroke" pathLength="100" fill="none" stroke="#1E1B2E" stroke-width="17" stroke-linecap="round" stroke-linejoin="round" d="M214,150 C190,138 124,142 122,192 C120,234 180,240 214,198 C216,235 218,265 204,282 C190,298 148,298 146,278 C145,262 180,248 222,228 C244,212 256,176 262,152 C264,195 268,226 296,226 C326,226 332,190 334,152 C335,190 336,212 342,222 C350,232 364,226 376,204 C392,168 410,116 416,72 C420,34 372,28 370,66 C366,112 364,175 366,222 C368,190 376,158 404,152 C434,146 442,190 440,212 C440,226 470,226 500,222 L540,222 C556,222 566,210 572,186 L582,92 L574,196 C572,228 604,232 626,206"/>
<g id="crayon-i">
  <path d="M488,150 H522 V212 Q522,224 510,224 H500 Q488,224 488,212 Z" fill="#FFC21A"/>
  <rect x="488" y="172" width="34" height="14" fill="#FFF8EE"/>
  <path d="M488,150 L505,106 L522,150 Z" fill="#F26B3A" stroke="#F26B3A" stroke-width="3" stroke-linejoin="round"/>
  <path d="M500,118 L505,106 L510,118 Z" fill="#1E1B2E"/>
</g>
<circle id="i-dot" cx="505" cy="72" r="11" fill="#F26B3A"/>
<path id="t-bar" fill="none" stroke="#1E1B2E" stroke-width="17" stroke-linecap="round" d="M548,148 C566,144 596,144 616,146"/>
</svg>

      </div>
      <div id="block">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 190" preserveAspectRatio="xMidYMid meet" focusable="false">
<title>guhit</title>
<g fill="none" stroke="#1E1B2E" stroke-width="15" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="52" cy="92" r="30"/><path d="M82,62 V122 C82,152 62,168 34,160"/>
  <path d="M126,62 V102 C126,130 168,130 171,102 M171,62 V132"/>
  <path d="M214,12 V132 M214,98 C216,58 266,56 266,94 V132"/>
  <path d="M368,28 V112 C368,128 382,134 402,130 M348,64 H398"/>
</g>
<g>
  <path d="M300,66 H324 V126 Q324,134 316,134 H308 Q300,134 300,126 Z" fill="#F26B3A"/>
  <path d="M300,66 L312,32 L324,66 Z" fill="#FFC21A" stroke="#FFC21A" stroke-width="2" stroke-linejoin="round"/>
  <path d="M308,44 L312,32 L316,44 Z" fill="#1E1B2E"/>
  <rect x="300" y="86" width="24" height="12" fill="#2F9BEA"/>
  <circle cx="312" cy="8" r="7" fill="#FFC21A"/>
</g>
</svg>

      </div>
    </div>
    <p class="tag" id="tag">Draw it. Watch it wake up.</p>
    <div class="foot" id="foot">v0.1.0 · © 2026 Kaya Randomized</div>
  </section>
</main>
<script>
(()=>{
const HOLD=500, FADE=350, T_END=2650;           // ms: hold on final composition, fade, end of build-up
const $=s=>document.querySelector(s), clamp=x=>Math.max(0,Math.min(1,x));
const E={out:p=>1-Math.pow(1-p,3),expo:p=>p>=1?1:1-Math.pow(2,-10*p),io:p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2,
  sine:p=>-(Math.cos(Math.PI*p)-1)/2,back:p=>{const c=1.9;return 1+(c+1)*Math.pow(p-1,3)+c*Math.pow(p-1,2)},lin:p=>p};
const seg=(t,a,b,e=E.out)=>e(clamp((t-a)/(b-a)));
const svgScale=(el,cx,cy,sx,sy=sx)=>el.setAttribute('transform',`translate(${cx} ${cy}) scale(${sx} ${sy}) translate(${-cx} ${-cy})`);

// ---- cursive (swap-friendly: only ids stroke / crayon-i / i-dot are used) ----
const cur=$('#cursive svg'), stroke=cur.querySelector('#stroke'), ci=cur.querySelector('#crayon-i'), dot=cur.querySelector('#i-dot');
const TOTAL=stroke.getTotalLength(), P0=stroke.getPointAtLength(0), P1=stroke.getPointAtLength(TOTAL);
stroke.style.strokeDasharray='100 100';
const bb=ci.getBBox(), tipX=bb.x+bb.width/2, tipY=bb.y;
const pen=document.createElementNS('http://www.w3.org/2000/svg','g'); pen.appendChild(ci.cloneNode(true)); pen.firstChild.removeAttribute('id');
cur.appendChild(pen);
const tbar=cur.querySelector('#t-bar'); if(tbar){tbar.setAttribute('pathLength','100');tbar.style.strokeDasharray='100 100'}
const dbb=dot.getBBox(), dcx=dbb.x+dbb.width/2, dcy=dbb.y+dbb.height/2;
// ---- mark ----
const M=$('#mark svg'), q=s=>M.querySelector(s);
const loop=q('#loop'), face=q('#face'), eyeL=q('#eye-l'), eyeR=q('#eye-r'), smile=q('#smile');
const rays=[1,2,3,4,5,6,7].map(i=>q('#ray-'+i));
smile.setAttribute('pathLength','1'); smile.style.strokeDasharray='1 1'; loop.style.strokeDasharray='100 100';
const FC={x:277,y:247};

function render(t){
  const c=reduced?T_END:t;
  // 1 pen enters + writes
  const enter=seg(c,0,250), w=seg(c,250,1450,p=>.4*p+.6*E.sine(p));
  stroke.style.strokeDashoffset=100*(1-w); stroke.style.visibility=w>0?'visible':'hidden';
  const hop=seg(c,1450,1750,E.io);
  let x,y,rot,s;
  const wp=stroke.getPointAtLength(w*TOTAL);
  const wob=(c>250&&c<1450)?Math.sin(c*.045):0;
  if(hop<=0){
    x=wp.x+(1-enter)*-110+wob*.8; y=wp.y+(1-enter)*-150+Math.cos(c*.06)*.6; rot=-140+wob*3+(1-enter)*-20; s=.5+.05*enter;
  }else{
    x=P1.x+(tipX-P1.x)*hop; y=P1.y+(tipY-P1.y)*hop-4*95*hop*(1-hop); rot=-140+140*hop; s=.55+.45*E.out(hop);
  }
  pen.setAttribute('transform',`translate(${x} ${y}) rotate(${rot}) scale(${s}) translate(${-tipX} ${-tipY})`);
  pen.style.opacity=Math.min(1,enter*3);
  const landed=c>=1750;
  pen.style.display=landed?'none':''; ci.style.opacity=landed?1:0;
  const dp=seg(c,1750,1980,E.back); svgScale(dot,dcx,dcy,Math.max(dp,0)); dot.style.opacity=dp>0?1:0;
  if(tbar){const tp=seg(c,1790,1940,E.out);tbar.style.strokeDashoffset=100*(1-tp);tbar.style.visibility=tp>0?'visible':'hidden'}
  // 2 cursive -> block
  const m=seg(c,1960,2250,E.io);
  const cd=$('#cursive'), bd=$('#block');
  cd.style.opacity=1-m; cd.style.transform=`scale(${1+.05*m})`; cd.style.filter=m?`blur(${m*6}px)`:'none';
  bd.style.opacity=m; bd.style.transform=`scale(${.95+.05*m})`; bd.style.filter=m<1?`blur(${(1-m)*6}px)`:'none';
  // 3 mark
  const mp=seg(c,1950,2250,E.back), mo=seg(c,1950,2100);
  const mk=$('#mark'); mk.style.opacity=mo; mk.style.transform=`translateY(${(1-mo)*10}px) scale(${.8+.2*mp})`;
  const lp=seg(c,1980,2330,E.out); loop.style.strokeDashoffset=100*(1-lp); loop.style.visibility=lp>0?'visible':'hidden';
  const fp=seg(c,2250,2400,E.back); svgScale(face,FC.x,FC.y,Math.max(fp,.001)); face.style.opacity=clamp(fp*2);
  const ep=seg(c,2300,2420,E.back);
  const bl=c>2480?1-.9*(1-Math.abs((seg(c,2480,2600,E.lin)-.5)*2)):1;   // one blink
  [eyeL,eyeR].forEach(e=>{const cx=+e.getAttribute('cx'),cy=+e.getAttribute('cy');svgScale(e,cx,cy,Math.max(ep,.001),Math.max(ep*bl,.001));e.style.opacity=ep>0?1:0});
  const sp=seg(c,2350,2500,E.out); smile.style.strokeDashoffset=1-sp; smile.style.visibility=sp>0?'visible':'hidden';
  rays.forEach((r,i)=>{const p=seg(c,2250+i*30,2450+i*30,E.back); svgScale(r,FC.x,FC.y,Math.max(.001,.25+.75*p)); r.style.opacity=clamp(p*3)});
  // 4 tagline + footer
  const tg=seg(c,2250,2600,E.out), tag=$('#tag'); tag.style.opacity=tg; tag.style.transform=`translateY(${(1-tg)*16}px)`;
  $('#foot').style.opacity=seg(c,2400,2600,E.out);
  // 5 fade to home
  const fs=reduced?1000:T_END+HOLD, f=clamp((t-fs)/FADE);
  $('#splash').style.opacity=1-f; $('#home').style.opacity=E.out(f);
  $('#home').style.transform=`scale(${.98+.02*E.out(f)})`;
  return t<fs+FADE;
}

let reduced=matchMedia('(prefers-reduced-motion: reduce)').matches, raf=0;
const rm=$('#rm'); rm.checked=reduced;
function play(){
  cancelAnimationFrame(raf); const t0=performance.now();
  const tick=now=>{ if(render(now-t0)) raf=requestAnimationFrame(tick); else render(1e9); };
  raf=requestAnimationFrame(tick);
}
$('#replay').onclick=play;
rm.onchange=()=>{reduced=rm.checked;play()};
const fr=new URLSearchParams(location.search).get('t');   // ?t=1200 freezes on a frame (for screenshots)
if(fr!==null){render(+fr)}else play();
})();
</script>
</body>
</html>
